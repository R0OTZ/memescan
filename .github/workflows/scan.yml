name: scan
on:
  schedule:
    - cron: "3-59/10 * * * *"   # backup starter in case the loop chain ever breaks
  workflow_dispatch: {}
concurrency:
  group: scan
  cancel-in-progress: false
permissions:
  contents: read
  actions: write   # lets each run start the next one
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Restore bot memory
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: Scan about once a minute for 55 minutes, answer Telegram instantly
        run: |
          end=$((SECONDS + 55*60))
          python3 listener.py $((55*60)) &   # replies to your commands within seconds
          while [ $SECONDS -lt $end ]; do
            git pull -q --ff-only origin main || true   # pick up code updates without a restart
            python3 scanner.py || echo "scan failed, retrying next cycle"
            sleep 15
          done
          wait
        env:
          LISTENER: "1"
          COPY_WALLETS: ""   # traders to copy, as name:wallet,name:wallet
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WALLET: ${{ secrets.WALLET }}
          STAKE_USD: "2"
      - name: Save bot memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}
      - name: Start the next hour
        if: ${{ !cancelled() }}
        run: gh workflow run scan.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
